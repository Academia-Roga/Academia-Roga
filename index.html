:root{
  --bg: #F7F7F8;
  --surface: #FFFFFF;
  --surface-2: #F0F0F1;
  --ink: #1A1A1E;
  --ink-muted: #6B6B72;
  --line: #E9E9EC;

  --rojo: #B20E10;
  --rojo-oscuro: #8A0B0D;
  --rojo-tint: #FBEAEA;
  --gris: #767676;
  --gris-tint: #F0F0F1;
  --verde: #2F9E5B;
  --verde-tint: #E9F7EE;

  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow-soft: 0 8px 26px rgba(20,20,25,0.06);
  --shadow-soft-hover: 0 14px 34px rgba(20,20,25,0.10);
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
}
button{ font-family: inherit; }

/* ---------- topbar / breadcrumb ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding: 16px 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top:0;
  z-index: 40;
}
.breadcrumb{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex: 1;
}
.breadcrumb-logo{ height: 44px; width:auto; flex-shrink:0; }
.crumb{
  font-size: 14px;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.crumb.current{ color: var(--ink); font-weight: 600; }
.crumb-sep{ color: var(--line); flex-shrink:0; }
.crumb-btn{
  background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:14px; color: var(--ink-muted);
  padding:0;
}
.crumb-btn:hover{ color: var(--rojo); }

.search-wrap{
  position: relative;
  flex-shrink: 0;
}
.search-wrap input{
  width: 230px;
  padding: 9px 14px 9px 34px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
}
.search-wrap input:focus{ outline: 2px solid var(--rojo); outline-offset: 1px; }
.search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.45; }

/* ---------- menú móvil (hamburguesa) ---------- */
.menu-btn{
  display:none;
  align-items:center; justify-content:center;
  width: 38px; height: 38px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  flex-shrink: 0;
}
.mobile-menu{
  display:none;
  position: fixed;
  inset: 0;
  background: rgba(20,20,25,0.4);
  z-index: 50;
}
.mobile-menu.open{ display:block; }
.mobile-menu-panel{
  position:absolute;
  top:0; left:0; right:0;
  background: var(--surface);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  padding: 18px 18px 24px;
  box-shadow: var(--shadow-soft-hover);
  max-height: 80vh;
  overflow-y: auto;
}
.mobile-menu-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 14px;
}
.mobile-menu-head span{ font-weight:800; font-size:15px; }
.mobile-menu-close{
  background:none; border:none; cursor:pointer; font-size:20px; color:var(--ink-muted);
  padding: 4px 8px;
}
.mobile-menu-item{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left;
  background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:15px; font-weight:600; color:var(--ink);
  padding: 13px 8px; border-bottom: 1px solid var(--line);
}
.mobile-menu-item:last-child{ border-bottom:none; }
.mobile-menu-item .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background: #2B2B2B; }
.mobile-menu-item .n{ margin-left:auto; font-size:12.5px; font-weight:500; color:var(--ink-muted); }
.mobile-menu-item.active{ color: var(--rojo); }
.mobile-menu-item.active .dot{ background: var(--rojo); }

/* ---------- tabs horizontales ---------- */
.tabs-bar{
  display:flex;
  gap: 26px;
  padding: 0 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.tab{
  background:none;
  border:none;
  cursor:pointer;
  padding: 15px 2px 12px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink-muted);
  white-space: nowrap;
  position: relative;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.tab .tab-label{ display:flex; align-items:center; gap:7px; }
.tab .dot{ width:7px; height:7px; border-radius:50%; background: #2B2B2B; transition: background .15s ease; }
.tab .n{ font-weight:500; color: var(--ink-muted); font-size:12.5px; }
.tab.active{ color: var(--ink); }
.tab.active .dot{ background: var(--rojo); }
.tab:hover:not(.active){ color: var(--ink); }

main{ padding: 30px 32px 70px; max-width: 1280px; margin: 0 auto; }

/* ---------- vista: archivo / grid ---------- */
.hero{ margin-bottom: 26px; }
.hero-eyebrow{
  font-size: 12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
  color: var(--rojo-oscuro); margin-bottom:6px;
}
.hero-title{ font-size: 32px; font-weight:800; letter-spacing:-0.01em; margin:0 0 8px; }
.hero-desc{ color: var(--ink-muted); font-size:15px; max-width:640px; line-height:1.55; }

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(270px,1fr));
  gap: 20px;
}
.card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  transition: box-shadow .18s ease, transform .18s ease;
}
.card:hover{ box-shadow: var(--shadow-soft-hover); transform: translateY(-3px); }
.card:focus-visible{ outline: 2px solid var(--rojo); outline-offset: 2px; }
.card-thumb{
  height: 140px;
  position: relative;
  background: linear-gradient(135deg, var(--tema-tint, var(--surface-2)), var(--bg));
  display:flex; align-items:center; justify-content:center;
}
.card-play{
  width: 46px; height:46px; border-radius:50%;
  background: rgba(255,255,255,0.92);
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}
.card-topic-flag{
  position:absolute; top:10px; left:10px;
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  background: rgba(255,255,255,0.92); padding:4px 9px; border-radius:999px;
  color: var(--tema-color, var(--ink-muted));
}
.card-body{ padding: 14px 16px 16px; }
.card-title{ font-weight:700; font-size:15px; line-height:1.35; margin-bottom:10px; }
.card-meta-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
.pill{
  font-size: 11px; font-weight:600; padding: 4px 10px; border-radius:999px;
  background: var(--surface-2); color: var(--ink-muted);
}

.empty{ text-align:center; padding: 80px 20px; color: var(--ink-muted); grid-column: 1/-1; }
.empty .t{ font-size:19px; font-weight:800; color:var(--ink); display:block; margin-bottom:8px; }

/* ---------- vista: lección ---------- */
.lesson-layout{
  display:grid;
  grid-template-columns: 1fr 340px;
  gap: 30px;
  align-items:start;
}
.lesson-eyebrow{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin-bottom:8px; }
.lesson-title{ font-size: 28px; font-weight:800; letter-spacing:-0.01em; margin:0 0 14px; line-height:1.25; }
.lesson-badges{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.lesson-badge{
  font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px;
  display:flex; align-items:center; gap:6px;
}
.lesson-badge.tema{ background: var(--rojo-tint); color: var(--rojo-oscuro); }
.lesson-badge.neutral{ background: var(--surface-2); color: var(--ink-muted); }

.player-frame{
  border-radius: var(--radius-lg);
  overflow:hidden;
  background:#000;
  box-shadow: var(--shadow-soft);
  aspect-ratio: 16/9;
}
.player-frame iframe{ width:100%; height:100%; border:none; }

.lesson-section-title{ font-size:17px; font-weight:800; margin: 26px 0 10px; }
.lesson-desc{ color: var(--ink-muted); font-size:14.5px; line-height:1.65; max-width:680px; }

/* sidebar */
.side-card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-soft);
  margin-bottom: 20px;
  position: sticky;
  top: 128px;
}
.side-card + .side-card{ position: static; }
.side-card-title{ font-size:13px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:14px; }

.curriculum-module{ margin-bottom: 16px; }
.curriculum-module:last-child{ margin-bottom:0; }
.curriculum-module-title{
  display:flex; align-items:center; gap:9px;
  font-size:13px; font-weight:800; margin-bottom:8px;
}
.curriculum-module-badge{
  width:22px; height:22px; border-radius:50%; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:800; color:var(--ink-muted); flex-shrink:0;
}
.curriculum-item{
  display:flex; align-items:center; gap:10px;
  padding: 9px 8px; border-radius: var(--radius-sm);
  cursor:pointer; font-size:13.5px; color:var(--ink);
  transition: background .12s ease;
}
.curriculum-item:hover{ background: var(--surface-2); }
.curriculum-item.active{ background: var(--rojo-tint); color: var(--rojo-oscuro); font-weight:700; }
.curriculum-item .status-icon{
  width:18px; height:18px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  border: 1.5px solid var(--line);
}
.curriculum-item.active .status-icon{ border-color: var(--rojo); }
.curriculum-item .status-icon.current-dot::after{
  content:""; width:7px; height:7px; border-radius:50%; background: var(--rojo);
}
.curriculum-item .item-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.curriculum-item .item-duration{ font-size:11.5px; color:var(--ink-muted); flex-shrink:0; }

@media (max-width: 900px){
  .lesson-layout{ grid-template-columns: 1fr; }
  .side-card{ position: static; }
  main{ padding: 22px 18px 60px; }
  .topbar{ padding: 12px 18px; }
  .breadcrumb-logo{ height: 34px; }
  .tabs-bar{ display:none; }
  .menu-btn{ display:flex; }
  .search-wrap input{ width: 140px; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; scroll-behavior:auto !important; }
}
</style>

<script>
/* ======================================================================

   Ver instrucciones completas al inicio del <style> de este archivo.

    {

      nombre: "Máquinas y herramientas",
      color: "#B20E10",

      videos: [

        { titulo: "Suajes cuidados y como usarlos.", duracion: "07:34 min", fecha: "Julio 2026", driveId: "1PiJVTPIBwoE5_nh3x4Ihqp1a46bNMGic",portada: "https://lh3.googleusercontent.com/d/1h2H_e-41PhGNMsxdFKJxWID89gxm-fel" },

    {

      nombre: "Herramientas y sistemas",
      color: "#767676",
      descripcion: "Cómo usar el software y los sistemas internos del día a día.",
      videos: [
        { titulo: "Acceso y uso del sistema interno", duracion: "20 min", fecha: "Jun 2026", driveId: "REEMPLAZA_CON_TU_DRIVE_ID_3" },
        { titulo: "Correo, calendario y chat de equipo", duracion: "14 min", fecha: "Jun 2026", driveId: "REEMPLAZA_CON_TU_DRIVE_ID_4" },
      ]
    },
    {
      id: "procesos",
      nombre: "Procesos operativos",
      color: "#8A0B0D",
      descripcion: "Los procedimientos paso a paso que mantienen la operación funcionando.",
      videos: [
        { titulo: "Proceso de atención de pedidos", duracion: "25 min", fecha: "Jun 2026", driveId: "REEMPLAZA_CON_TU_DRIVE_ID_5" },
      ]
    },
    {
      id: "seguridad",
      nombre: "Seguridad y cumplimiento",
      color: "#B9B9B9",
      descripcion: "Políticas obligatorias de seguridad, datos y normativa interna.",
      videos: [
        { titulo: "Política de manejo de datos", duracion: "10 min", fecha: "Jul 2026", driveId: "REEMPLAZA_CON_TU_DRIVE_ID_6" },
      ]
    },
  ]
};

function driveEmbedUrl(id){ return `https://drive.google.com/file/d/${id}/preview`; }

/* ---------- estado ---------- */
let activeTopicId = "todos";
let searchTerm = "";
let currentVideo = null;

const tabsBar = document.getElementById('tabsBar');
const grid = document.getElementById('grid');
const heroEyebrow = document.getElementById('heroEyebrow');
const heroTitle = document.getElementById('heroTitle');
const heroDesc = document.getElementById('heroDesc');
const searchInput = document.getElementById('search');
const viewGrid = document.getElementById('viewGrid');
const viewLesson = document.getElementById('viewLesson');
const crumbHome = document.getElementById('crumbHome');
const crumbTemaWrap = document.getElementById('crumbTemaWrap');
const crumbTema = document.getElementById('crumbTema');
const menuBtn = document.getElementById('menuBtn');
const mobileMenu = document.getElementById('mobileMenu');
const mobileMenuClose = document.getElementById('mobileMenuClose');
const mobileMenuList = document.getElementById('mobileMenuList');

function allVideosFlat(){
  return DATA.temas.flatMap(t => t.videos.map(v => ({...v, temaId: t.id, temaNombre: t.nombre, temaColor: t.color, temaDescripcion: t.descripcion})));
}
function currentTopic(){ return DATA.temas.find(t => t.id === activeTopicId); }

function selectTopic(id){
  activeTopicId = id;
  searchTerm = '';
  searchInput.value = '';
  showGrid();
}

/* ---------- tabs (escritorio) ---------- */
function renderTabs(){
  tabsBar.innerHTML = '';
  const todosVideos = allVideosFlat();

  const makeTab = (id, nombre, videos) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeTopicId === id ? ' active' : '');
    btn.innerHTML = `<span class="tab-label"><span class="dot"></span>${nombre}<span class="n">(${videos.length})</span></span>`;
    btn.addEventListener('click', () => selectTopic(id));
    tabsBar.appendChild(btn);
  };

  makeTab('todos', 'Todos los temas', todosVideos);
  DATA.temas.forEach(t => makeTab(t.id, t.nombre, t.videos));
}

/* ---------- menú móvil ---------- */
function renderMobileMenu(){
  mobileMenuList.innerHTML = '';
  const todosVideos = allVideosFlat();

  const makeItem = (id, nombre, videos) => {
    const btn = document.createElement('button');
    btn.className = 'mobile-menu-item' + (activeTopicId === id ? ' active' : '');
    btn.innerHTML = `<span class="dot"></span>${nombre}<span class="n">${videos.length}</span>`;
    btn.addEventListener('click', () => { selectTopic(id); closeMobileMenu(); });
    mobileMenuList.appendChild(btn);
  };

  makeItem('todos', 'Todos los temas', todosVideos);
  DATA.temas.forEach(t => makeItem(t.id, t.nombre, t.videos));
}
function openMobileMenu(){ renderMobileMenu(); mobileMenu.classList.add('open'); }
function closeMobileMenu(){ mobileMenu.classList.remove('open'); }
menuBtn.addEventListener('click', openMobileMenu);
mobileMenuClose.addEventListener('click', closeMobileMenu);
mobileMenu.addEventListener('click', e => { if (e.target === mobileMenu) closeMobileMenu(); });

/* ---------- vista grid ---------- */
function renderHero(filteredCount){
  if (activeTopicId === 'todos' || searchTerm){
    heroEyebrow.textContent = searchTerm ? 'Resultados de búsqueda' : 'Archivo completo';
    heroTitle.textContent = searchTerm ? `“${searchTerm}”` : 'Todas las capacitaciones';
    heroDesc.textContent = searchTerm
      ? `${filteredCount} resultado${filteredCount === 1 ? '' : 's'} en todos los temas.`
      : 'Explora por tema arriba, o busca directamente por nombre.';
  } else {
    const t = currentTopic();
    heroEyebrow.textContent = 'Tema';
    heroTitle.textContent = t.nombre;
    heroDesc.textContent = t.descripcion;
  }
}

function renderGrid(){
  let videos = allVideosFlat();

  if (searchTerm){
    const q = searchTerm.toLowerCase();
    videos = videos.filter(v => v.titulo.toLowerCase().includes(q) || v.temaNombre.toLowerCase().includes(q));
  } else if (activeTopicId !== 'todos'){
    videos = videos.filter(v => v.temaId === activeTopicId);
  }

  renderHero(videos.length);
  grid.innerHTML = '';

  if (videos.length === 0){
    grid.innerHTML = `<div class="empty"><span class="t">Sin resultados</span>No encontramos ninguna capacitación con ese nombre. Prueba con otra palabra.</div>`;
    return;
  }

  videos.forEach(v => {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.style.setProperty('--tema-color', v.temaColor);
    card.style.setProperty('--tema-tint', v.temaColor + '22');
    const thumbStyle = v.portada
      ? `style="background-image:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.12)), url('${v.portada}'); background-size:cover; background-position:center;"`
      : '';
    card.innerHTML = `
      <div class="card-thumb" ${thumbStyle}>
        <span class="card-topic-flag">${v.temaNombre}</span>
        <span class="card-play"><svg width="16" height="16" viewBox="0 0 24 24" fill="${v.temaColor}"><polygon points="6,4 20,12 6,20"/></svg></span>
      </div>
      <div class="card-body">
        <div class="card-title">${v.titulo}</div>
        <div class="card-meta-row"><span class="pill">${v.duracion}</span><span class="pill">${v.fecha}</span></div>
      </div>
    `;
    const open = () => showLesson(v);
    card.addEventListener('click', open);
    card.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
    grid.appendChild(card);
  });
}

function showGrid(){
  currentVideo = null;
  document.getElementById('playerIframe').src = '';
  viewLesson.style.display = 'none';
  viewGrid.style.display = 'block';
  crumbTemaWrap.style.display = 'none';
  renderTabs();
  renderGrid();
}
crumbHome.addEventListener('click', showGrid);

/* ---------- vista lección ---------- */
function renderCurriculum(v){
  const box = document.getElementById('curriculum');
  box.innerHTML = '';
  const tema = DATA.temas.find(t => t.id === v.temaId);
  const mod = document.createElement('div');
  mod.className = 'curriculum-module';
  mod.innerHTML = `<div class="curriculum-module-title"><span class="curriculum-module-badge">${tema.nombre.slice(0,2).toUpperCase()}</span>${tema.nombre}</div>`;
  tema.videos.forEach(item => {
    const isActive = item.driveId === v.driveId;
    const row = document.createElement('div');
    row.className = 'curriculum-item' + (isActive ? ' active' : '');
    const iconHtml = `<span class="status-icon${isActive ? ' current-dot' : ''}"></span>`;
    row.innerHTML = `${iconHtml}<span class="item-title">${item.titulo}</span><span class="item-duration">${item.duracion}</span>`;
    row.addEventListener('click', () => showLesson({...item, temaId: tema.id, temaNombre: tema.nombre, temaColor: tema.color, temaDescripcion: tema.descripcion}));
    mod.appendChild(row);
  });
  box.appendChild(mod);
}

function showLesson(v){
  currentVideo = v;
  viewGrid.style.display = 'none';
  viewLesson.style.display = 'block';
  crumbTemaWrap.style.display = 'inline-flex';
  crumbTema.textContent = v.titulo;

  document.getElementById('lessonEyebrow').textContent = v.temaNombre;
  document.getElementById('lessonTitle').textContent = v.titulo;
  document.getElementById('lessonDesc').textContent = v.descripcion || v.temaDescripcion || '';
  document.getElementById('playerIframe').src = driveEmbedUrl(v.driveId);

  const badges = document.getElementById('lessonBadges');
  badges.innerHTML = `
    <span class="lesson-badge tema">${v.temaNombre}</span>
    <span class="lesson-badge neutral">${v.duracion}</span>
    <span class="lesson-badge neutral">${v.fecha}</span>
  `;

  renderCurriculum(v);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- búsqueda ---------- */
searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  if (viewLesson.style.display !== 'none') showGrid();
  else renderGrid();
});

/* ---------- init ---------- */
renderTabs();
renderGrid();
</script>

</body>
</html>
