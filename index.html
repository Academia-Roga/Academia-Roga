<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia Roga</title> <link rel="shortcut icon" href="Favicon.svg" type="image/svg+xml">
<script>
  // Aplica el modo noche guardado ANTES de pintar la página, para que no haya parpadeo.
  (function(){
    try {
      var saved = localStorage.getItem('roga_theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch(e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>

/* ======================================================================
   INSTRUCCIONES PARA AGREGAR / EDITAR CAPACITACIONES
   ======================================================================
   Busca el bloque   const DATA = {   más abajo en el bloque de <script>.
   Cada TEMA agrupa VIDEOS. Cada VIDEO admite:

     titulo:      Nombre de la capacitación
     duracion:    Ej. "18 min"
     fecha:       Ej. "Jun 2026" (cuándo se grabó)
     driveId:     El ID del archivo de Google Drive
     descripcion: (opcional) texto que se muestra bajo el video.
                  Si no lo pones, se usa la descripción del tema.
     portada:     (opcional) URL de una imagen para la miniatura del
                  video en las tarjetas. Si no la pones, se usa un
                  fondo de color liso. Puede ser un enlace de imagen
                  normal (https://...) o una imagen de Google Drive
                  compartida así:
                  https://drive.google.com/thumbnail?id=TU_DRIVE_ID&sz=w800

   ¿Cómo obtengo el driveId?
   1. En Google Drive, clic derecho al video > "Compartir" >
      Acceso general: "Cualquier persona con el enlace" (rol: Lector).
   2. Copia el enlace. Se verá así:
      https://drive.google.com/file/d/1AbCdEfGhIjKlMnOpQrSt/view?usp=sharing
   3. El driveId es la parte entre /d/ y /view:
      1AbCdEfGhIjKlMnOpQrSt
   ====================================================================== */

:root{
  --bg: #F7F7F8;
  --surface: #FFFFFF;
  --surface-2: #F0F0F1;
  --ink: #1A1A1E;
  --ink-muted: #6B6B72;
  --line: #E9E9EC;

  --rojo: #B20E10;
  --rojo-oscuro: #8A0B0D;
  --rojo-tint: #FBEAEA;
  --gris: #767676;
  --gris-tint: #F0F0F1;
  --verde: #2F9E5B;
  --verde-tint: #E9F7EE;

  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow-soft: 0 8px 26px rgba(20,20,25,0.06);
  --shadow-soft-hover: 0 14px 34px rgba(20,20,25,0.10);

}

/* ======================================================================
   MODO NOCHE
   ======================================================================
   Se activa agregando data-theme="dark" a la etiqueta <html>.
   Solo redefine las variables de color: el resto del CSS ya las usa,
   así que no fue necesario tocar ninguna otra regla.
   ====================================================================== */
html[data-theme="dark"]{
  --bg: #121214;
  --surface: #1B1B1F;
  --surface-2: #232327;
  --ink: #F1F1F3;
  --ink-muted: #9B9BA3;
  --line: #2E2E33;

  --rojo-tint: rgba(178,14,16,0.16);
  --gris-tint: #232327;
  --verde-tint: rgba(47,158,91,0.16);

  --shadow-soft: 0 8px 26px rgba(0,0,0,0.35);
  --shadow-soft-hover: 0 14px 34px rgba(0,0,0,0.5);
}
html[data-theme="dark"] .card-play{ background: rgba(30,30,34,0.92); }
html[data-theme="dark"] .mobile-menu{ background: rgba(0,0,0,0.6); }
html[data-theme="dark"] ::selection{ background: var(--rojo); color:#fff; }

/* ---------- botón de modo noche ---------- */
.theme-toggle{
  display:flex; align-items:center; justify-content:center;
  width: 38px; height: 38px; flex-shrink:0;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-muted);
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.theme-toggle:hover{ background: var(--surface-2); color: var(--ink); }
.theme-toggle svg{ display:block; }
.theme-toggle .icon-sun{ display:none; }
html[data-theme="dark"] .theme-toggle .icon-moon{ display:none; }
html[data-theme="dark"] .theme-toggle .icon-sun{ display:block; }
/* Forzar el color oficial SOLAMENTE en las etiquetas pequeñas */
.card-topic-flag, 
.sidebar-item.active .dot,
.curriculum-item.active .status-icon {
    background-color: var(--rojo) !important;
    border-color: var(--rojo) !important;
}
/* Excepción: si la lección activa YA está marcada como terminada, el check
   verde debe ganarle al rojo de "actual" -si no, la lección recién
   completada se ve igual que una que apenas se está viendo. */
.curriculum-item.active .status-icon.done {
    background-color: var(--verde) !important;
    border-color: var(--verde) !important;
}

/* Si quieres que el texto de hero-eyebrow sea rojo, usa esto (pero sin fondo): */
.hero-eyebrow {
    color: var(--rojo) !important;
}

/* Asegurar que el texto de las etiquetas sea blanco */
.card-topic-flag {
    color: white !important;
}
*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
}
button{ font-family: inherit; }

/* ---------- topbar / breadcrumb ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding: 16px 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top:0;
  z-index: 40;
}
.breadcrumb{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex: 1;
}
.breadcrumb-logo{ height: 44px; width:auto; flex-shrink:0; }
.crumb{
  font-size: 14px;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.crumb.current{ color: var(--ink); font-weight: 600; }
.crumb-sep{ color: var(--line); flex-shrink:0; }
.crumb-btn{
  background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:14px; color: var(--ink-muted);
  padding:0;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex-shrink: 1;
}
.crumb-btn:hover{ color: var(--rojo); }
#crumbTemaWrap{ display:inline-flex; align-items:center; gap:10px; min-width:0; overflow:hidden; }

.search-wrap{
  position: relative;
  flex-shrink: 0;
}
.search-wrap input{
  width: 230px;
  padding: 9px 14px 9px 34px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
}
.search-wrap input:focus{ outline: 2px solid var(--rojo); outline-offset: 1px; }
.search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.45; }

/* ---------- menú de usuario ---------- */
.user-menu{ position: relative; flex-shrink: 0; }
.user-menu-btn{
  display:flex; align-items:center; gap:9px;
  background: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 12px 4px 4px; cursor:pointer;
  font-family:'Plus Jakarta Sans', sans-serif;
  transition: background .15s ease;
}
.user-menu-btn:hover{ background: var(--surface-2); }
.user-avatar{
  width: 32px; height:32px; border-radius:50%; flex-shrink:0;
  background: var(--rojo); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:12.5px; letter-spacing:.02em;
}
.user-name{ font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; }
.user-chevron{ opacity:.5; flex-shrink:0; transition: transform .15s ease; }
.user-menu-btn[aria-expanded="true"] .user-chevron{ transform: rotate(180deg); }

.user-dropdown{
  position:absolute; top: calc(100% + 10px); right:0;
  background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-md);
  box-shadow: var(--shadow-soft-hover);
  min-width: 190px; padding: 8px;
  display:none; z-index: 60;
}
.user-dropdown.open{ display:block; }
.user-dropdown-label{
  font-size: 11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  color: var(--ink-muted); padding: 8px 12px 6px;
}
.user-dropdown-item{
  display:flex; align-items:center; gap:9px;
  width:100%; text-align:left; background:none; border:none; cursor:pointer;
  padding: 10px 12px; border-radius: var(--radius-sm);
  font-family: inherit; font-size:13.5px; font-weight:600; color: var(--ink);
}
.user-dropdown-item:hover{ background: var(--surface-2); }
.user-dropdown-item.danger{ color: var(--rojo); }
.user-dropdown-item.danger:hover{ background: var(--rojo-tint); }

/* ---------- menú móvil (hamburguesa) ---------- */
.menu-btn{
  display:none;
  align-items:center; justify-content:center;
  width: 38px; height: 38px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  flex-shrink: 0;
}
.mobile-menu{
  display:none;
  position: fixed;
  inset: 0;
  background: rgba(20,20,25,0.4);
  z-index: 50;
}
.mobile-menu.open{ display:block; }
.mobile-menu-panel{
  position:absolute;
  top:0; left:0; right:0;
  background: var(--surface);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  padding: 18px 18px 24px;
  box-shadow: var(--shadow-soft-hover);
  max-height: 80vh;
  overflow-y: auto;
}
.mobile-menu-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 14px;
}
.mobile-menu-head span{ font-weight:800; font-size:15px; }
.mobile-menu-close{
  background:none; border:none; cursor:pointer; font-size:20px; color:var(--ink-muted);
  padding: 4px 8px;
}
.mobile-menu-item{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left;
  background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:15px; font-weight:600; color:var(--ink);
  padding: 13px 8px; border-bottom: 1px solid var(--line);
}
.mobile-menu-item:last-child{ border-bottom:none; }
.mobile-menu-item .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background: #2B2B2B; }
.mobile-menu-item .n{ margin-left:auto; font-size:12.5px; font-weight:500; color:var(--ink-muted); }
.mobile-menu-item.active{ color: var(--rojo); }
.mobile-menu-item.active .dot{ background: var(--rojo); }

/* ---------- app shell: sidebar + contenido ---------- */
.app-shell{
  display:flex;
  align-items:flex-start;
  width: 100%;
}

.sidebar{
  width: 200px; /* Reducido de 240px para quitar el exceso de espacio */
  flex-shrink: 0;
  padding: 26px 12px 40px; /* Ajustado el espacio interno */
  position: sticky;
  top: 73px;
  height: calc(100vh - 73px);
  overflow-y: auto;
  border-right: 1px solid var(--line);
}
.sidebar-label{
  font-size: 11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color: var(--ink-muted); margin: 6px 0 10px; padding: 0 12px;
}
.sidebar-item{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left;
  background:none; border:none; cursor:pointer;
  padding: 10px 12px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight:600; color: var(--ink);
  margin-bottom: 2px;
}
.sidebar-item:hover{ background: var(--surface-2); }
.sidebar-item.active{ background: var(--rojo-tint); color: var(--rojo-oscuro); }
.sidebar-item .dot{ width:7px; height:7px; border-radius:50%; background:#2B2B2B; flex-shrink:0; transition: background .15s ease; }
.sidebar-item.active .dot{ background: var(--rojo); }
.sidebar-item .label-text{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sidebar-item .n{ font-size:12px; font-weight:500; color: var(--ink-muted); flex-shrink:0; }
.sidebar-item.active .n{ color: var(--rojo-oscuro); }

main{ flex:1; min-width:0; padding: 30px 36px 70px; }

/* ---------- vista: archivo / grid ---------- */
.hero{ margin-bottom: 26px; }
.hero-eyebrow{
  font-size: 12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
  color: var(--rojo-oscuro); margin-bottom:6px;
}
.hero-title{ font-size: 32px; font-weight:800; letter-spacing:-0.01em; margin:0 0 8px; }
.hero-desc{ color: var(--ink-muted); font-size:15px; max-width:640px; line-height:1.55; }

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(270px,1fr));
  gap: 22px;
}
.card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  transition: box-shadow .18s ease, transform .18s ease;
}
.card:hover{ box-shadow: var(--shadow-soft-hover); transform: translateY(-3px); }
.card:focus-visible{ outline: 2px solid var(--rojo); outline-offset: 2px; }
.card-thumb{
  height: 150px;
  position: relative;
  background: linear-gradient(135deg, var(--tema-tint, var(--surface-2)), var(--bg));
  display:flex; align-items:center; justify-content:center;
}
.card-play{
  width: 46px; height:46px; border-radius:50%;
  background: rgba(255,255,255,0.92);
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}
.card-topic-flag{
  position:absolute; top:0; left:0;
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  background: var(--tema-color, var(--ink-muted)); color:#fff; padding:5px 11px 5px 12px;
  border-radius: 0 0 8px 0;
}
.card-body{ padding: 15px 16px 16px; }
.card-title{ font-weight:700; font-size:15px; line-height:1.35; margin-bottom:6px; }
.card-desc{
  font-size: 12.5px; color: var(--ink-muted); line-height:1.5; margin-bottom:12px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.card-stats{ display:flex; gap:14px; padding-top:11px; border-top:1px solid var(--line); }
.card-stat{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-muted); font-weight:600; }
.card-stat svg{ flex-shrink:0; opacity:.7; }

.empty{ text-align:center; padding: 80px 20px; color: var(--ink-muted); grid-column: 1/-1; }
.empty .t{ font-size:19px; font-weight:800; color:var(--ink); display:block; margin-bottom:8px; }

.section-label{
  font-size: 13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
  color: var(--ink); margin: 6px 0 16px;
}
#featuredSection{ margin-bottom: 36px; }

/* ---------- vista: lección ---------- */
.lesson-layout{
  display:grid;
  grid-template-columns: 1fr 340px;
  gap: 30px;
  align-items:start;
}
/* Sin esto, los elementos de un grid nunca se encogen más allá del ancho
   de su contenido (título largo, reproductor, etc.), así que en celulares
   angostos toda la página se volvía más ancha que la pantalla: se veía
   "cortada" y sin poder desplazarse para ver el resto. */
.lesson-layout > div{ min-width: 0; }
.lesson-eyebrow{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin-bottom:8px; }
.lesson-title{ font-size: 28px; font-weight:800; letter-spacing:-0.01em; margin:0 0 14px; line-height:1.25; }
.lesson-badges{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.lesson-badge{
  font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px;
  display:flex; align-items:center; gap:6px;
}
.lesson-badge.tema{ background: var(--rojo-tint); color: var(--rojo-oscuro); }
.lesson-badge.neutral{ background: var(--surface-2); color: var(--ink-muted); }

.player-frame{
  border-radius: var(--radius-lg);
  overflow:hidden;
  background:#000;
  box-shadow: var(--shadow-soft);
  aspect-ratio: 16/9;
}
.player-frame iframe{ width:100%; height:100%; border:none; }
.player-frame #ytPlayerHost iframe{ width:100%; height:100%; border:none; }

.lesson-section-title{ font-size:17px; font-weight:800; margin: 26px 0 10px; }
.lesson-desc{ color: var(--ink-muted); font-size:14.5px; line-height:1.65; max-width:680px; }

/* sidebar */
.side-card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-soft);
  margin-bottom: 20px;
  position: sticky;
  top: 128px;
}
.side-card + .side-card{ position: static; }
.side-card-title{ font-size:13px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:14px; }

.curriculum-module{ margin-bottom: 16px; }
.curriculum-module:last-child{ margin-bottom:0; }
.curriculum-module-title{
  display:flex; align-items:center; gap:9px;
  font-size:13px; font-weight:800; margin-bottom:8px;
}
.curriculum-module-badge{
  width:22px; height:22px; border-radius:50%; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:800; color:var(--ink-muted); flex-shrink:0;
}
.curriculum-item{
  display:flex; align-items:center; gap:10px;
  padding: 9px 8px; border-radius: var(--radius-sm);
  cursor:pointer; font-size:13.5px; color:var(--ink);
  transition: background .12s ease;
}
.curriculum-item:hover{ background: var(--surface-2); }
.curriculum-item.active{ background: var(--rojo-tint); color: var(--rojo-oscuro); font-weight:700; }
.curriculum-item .status-icon{
  width:18px; height:18px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  border: 1.5px solid var(--line);
}
.curriculum-item.active .status-icon{ border-color: var(--rojo); }
.curriculum-item .status-icon.current-dot::after{
  content:""; width:7px; height:7px; border-radius:50%; background: var(--rojo);
}
/* Video visto por completo (últimos 10 segundos alcanzados, o terminó) */
.curriculum-item .status-icon.done{
  border-color: var(--verde); background: var(--verde);
  color:#fff;
}
.curriculum-item .status-icon.done svg{ display:block; }
/* Video con avance guardado pero todavía no terminado */
.curriculum-item .status-icon.in-progress{ border-color: var(--verde); }
.curriculum-item .status-icon.in-progress::after{
  content:""; width:8px; height:8px; border-radius:50%; background: var(--verde-tint);
  border: 1.5px solid var(--verde);
}
.curriculum-item .item-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.curriculum-item .item-duration{ font-size:11.5px; color:var(--ink-muted); flex-shrink:0; }

@media (min-width: 901px) and (max-width: 1150px){
  .sidebar{ width: 200px; }
  main{ padding: 26px 24px 60px; }
}

@media (max-width: 900px){
  .lesson-layout{ grid-template-columns: 1fr; }
  .side-card{ position: static; }
  main{ padding: 22px 18px 60px; }
  .topbar{
    padding: 12px 18px;
    flex-wrap: wrap;
    row-gap: 10px;
  }
  .breadcrumb-logo{ height: 34px; }
  .breadcrumb{ order: 1; flex: 1 1 auto; min-width: 0; }
  .theme-toggle{ order: 2; }
  .user-menu{ order: 3; }
  .menu-btn{ order: 4; }
  .search-wrap{ order: 5; flex: 1 1 100%; width: 100%; }
  .search-wrap input{ width: 100%; }
  .sidebar{ display:none; }
  .menu-btn{ display:flex; }
  .user-name{ display:none; }
  .user-menu-btn{ padding: 4px; border-color: transparent; }
  .user-dropdown{ right: -4px; }

  /* Antes esto forzaba una altura fija (42vh, entre 250 y 380px) e
     ignoraba el ancho de la pantalla, así que en celular el video se veía
     casi cuadrado en vez de mantener su proporción real de 16:9. Basta con
     no tocar aspect-ratio aquí: al ser 100% del ancho disponible, el alto
     se calcula solo y el video se ve proporcionado en cualquier tamaño. */
}

/* ======================================================================
   PANTALLA DE ACCESO
   ======================================================================
   IMPORTANTE: esto es solo una SIMULACIÓN visual de un login, para que
   la página no se sienta "abierta a cualquiera". No es seguridad real:
   como todo vive en este mismo archivo HTML, cualquiera que abra el
   código fuente puede ver el usuario y la contraseña. No la uses para
   proteger información sensible. Para eso se necesita el login con
   Google que platicamos antes.

   Para cambiar el usuario/contraseña, edita estas dos líneas más abajo
   en el <script>:
       const LOGIN_USUARIO = "admin";
       const LOGIN_CONTRASENA = "admin";
   ====================================================================== */
.login-screen{
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 20px;
}
.login-card{
  width: 100%;
  max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft-hover);
  padding: 36px 32px 32px;
  text-align: center;
}
.login-logo{ height: 52px; width:auto; margin-bottom: 18px; }
.login-title{ font-size: 19px; font-weight: 800; margin: 0 0 6px; color: var(--ink); }
.login-sub{ font-size: 13px; color: var(--ink-muted); margin: 0 0 24px; }
.login-field{ text-align:left; margin-bottom: 14px; }
.login-field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-muted); margin-bottom:6px; }
.login-field input{
  width: 100%;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  color: var(--ink);
}
.login-field input:focus{ outline: 2px solid var(--rojo); outline-offset: 1px; }
.login-error{
  font-size: 12.5px; font-weight:600; color: var(--rojo);
  margin: -4px 0 14px; display:none; text-align:left;
}
.login-error.show{ display:block; }
.login-btn{
  width: 100%;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--rojo);
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s ease;
}
.login-btn:hover{ background: var(--rojo-oscuro); }

/* ---------- ranking de operadores ---------- */
.ranking-panel{ max-width:880px; margin:0 auto; }
.ranking-hero{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:28px; box-shadow:var(--shadow-soft); margin-bottom:18px; }
.ranking-eyebrow{ color:var(--rojo); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
.ranking-title{ margin:0; font-size:26px; letter-spacing:-.03em; }
.ranking-subtitle{ margin:8px 0 0; color:var(--ink-muted); font-size:14px; line-height:1.55; }
.ranking-score-card{ display:flex; align-items:center; gap:20px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow-soft); }
.ranking-score-number{ width:86px; height:86px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--rojo-tint); color:var(--rojo); font-size:38px; font-weight:800; }
.ranking-score-label{ margin:0; font-size:17px; font-weight:800; }
.ranking-score-copy{ margin:5px 0 0; color:var(--ink-muted); font-size:13.5px; }
.ranking-stars{ display:flex; gap:4px; margin-top:9px; color:var(--rojo); font-size:21px; letter-spacing:1px; }
.ranking-empty{ color:var(--ink-muted); font-size:14px; }
.leaderboard-shell{background:radial-gradient(135% 150% at 50% -15%,#ff3b30 0%,#e21b1e 32%,#b20e10 62%,#7e0a0c 100%);border-radius:24px;padding:20px;box-shadow:0 18px 34px rgba(178,14,16,.4);color:#fff;overflow:hidden;position:relative}
.leaderboard-shell::before{content:"";position:absolute;left:-15%;right:-15%;bottom:-46%;height:75%;background:rgba(255,255,255,.08);border-radius:50%;pointer-events:none}
.leaderboard-shell::after{content:"";position:absolute;top:-30%;right:-20%;width:60%;height:60%;background:radial-gradient(circle,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 70%);pointer-events:none}
.leaderboard-shell > *{position:relative}
.leaderboard-shell .ranking-hero{background:transparent;border:0;box-shadow:none;padding:12px 10px 22px;text-align:center;margin:0}
.leaderboard-shell .ranking-eyebrow,.leaderboard-shell .ranking-title,.leaderboard-shell .ranking-subtitle{color:#fff}
.leaderboard-shell .ranking-eyebrow{color:#ffe1a8;opacity:.95}
.leaderboard-shell .ranking-title{font-size:28px;text-transform:uppercase;letter-spacing:.04em}
.leaderboard-shell .ranking-subtitle{opacity:.85}
/* Contenedor genérico para tablas del panel admin que necesitan scroll
   horizontal en pantallas angostas (Cursos, Usuarios, Exámenes, etc).
   La sombra suave en el borde derecho es una pista visual de que hay
   más columnas hacia ese lado, para que no parezca que la tabla está
   "cortada" sin remedio. */
.table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
@media (max-width:860px){
  .table-scroll{ box-shadow: inset -18px 0 14px -14px rgba(0,0,0,.22); }
}
.leaderboard-table-wrap{background:#fff;border-radius:16px;padding:8px;color:#252525;overflow-x:auto}
.leaderboard-table{width:100%;min-width:480px;border-collapse:separate;border-spacing:0;font-size:13px}
.leaderboard-table th{background:#7a7a7d;color:#fff;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;padding:11px 12px;text-align:left}
.leaderboard-table th:first-child{border-radius:10px 0 0 10px}.leaderboard-table th:last-child{border-radius:0 10px 10px 0}
.leaderboard-table td{padding:13px 12px;border-bottom:1px solid #e5e5e5;vertical-align:middle}
.leaderboard-table tr:last-child td{border-bottom:0}
.leaderboard-table tr:nth-child(even) td{background:#f4f4f5}
.leaderboard-table td:first-child{font-size:19px;font-weight:800;color:#969696;width:42px;text-align:center}
.leaderboard-table tr:nth-child(1) td:first-child{color:#b20e10}.leaderboard-table tr:nth-child(2) td:first-child{color:#8a8a8a}.leaderboard-table tr:nth-child(3) td:first-child{color:#b3b3b3}
.leaderboard-name{font-weight:800;color:#252525;white-space:nowrap}.leaderboard-score{font-size:18px;font-weight:900;color:#b20e10;white-space:nowrap}.leaderboard-muted{color:#888;font-size:12px}
.leaderboard-bar{height:7px;background:#e4e4e5;border-radius:99px;overflow:hidden;min-width:90px}.leaderboard-bar span{display:block;height:100%;background:linear-gradient(90deg,#b20e10,#d52b2d);border-radius:inherit}
.dashboard-ranking-section{margin-bottom:34px;grid-column:1/-1;grid-row:2}
.leaderboard-podium{display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:end;gap:12px;padding:8px 22px 26px;text-align:center}
.leaderboard-place{display:flex;flex-direction:column;align-items:center;min-width:0}
.leaderboard-place:first-child{order:2}.leaderboard-place:nth-child(2){order:1}.leaderboard-place:nth-child(3){order:3}
.leaderboard-crown-wrap{position:relative;display:flex;justify-content:center;align-items:flex-end;height:46px;margin-bottom:0}
.leaderboard-crown{display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.leaderboard-first-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-3deg);background:linear-gradient(180deg,#ffe9a8 0%,#f7c948 55%,#eeae1e 100%);color:#7a3d0a;font-weight:900;font-size:12.5px;line-height:1;padding:3px 10px 2px;border-radius:5px;border:1.5px solid #fff;box-shadow:0 3px 7px rgba(0,0,0,.3);letter-spacing:.02em;z-index:2}
.leaderboard-avatar-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.leaderboard-sunburst{position:absolute;width:190%;height:190%;pointer-events:none;animation:leaderboard-spin 9s linear infinite}
@keyframes leaderboard-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.leaderboard-avatar{position:relative;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f4f4f5;border:3px solid #fff;color:#b20e10;font-weight:900;font-size:20px;box-shadow:0 5px 12px rgba(0,0,0,.25)}
.leaderboard-place:first-child .leaderboard-avatar{width:86px;height:86px;font-size:28px;box-shadow:0 0 0 4px #f7c948,0 8px 18px rgba(0,0,0,.35)}
.leaderboard-medal{font-size:11.5px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:.03em;opacity:.9}
.leaderboard-place-name{font-size:12px;font-weight:800;color:#fff;max-width:150px;width:100%;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px}
.leaderboard-place-score{font-size:19px;font-weight:900;color:#fff;margin-top:2px}
.leaderboard-place:first-child .leaderboard-place-score{font-size:26px}
@media (max-width:560px){.leaderboard-shell{padding:12px}.leaderboard-table td,.leaderboard-table th{padding:10px 8px}.leaderboard-table .leaderboard-hide-mobile{display:none}}
@media (max-width:560px){ .ranking-hero{ padding:22px 18px; } .ranking-title{ font-size:22px; } .ranking-score-card{ padding:18px; gap:14px; } .ranking-score-number{ width:70px; height:70px; font-size:31px; } }
/* Podio del ranking en pantallas angostas: el texto del correo y los
   círculos con corona se salían de su columna y quedaban montados
   sobre el contenido vecino. Se reduce el espaciado, se acorta el
   nombre visible y se limita el ancho de cada columna al de su propia
   celda del grid (ver "width:100%;box-sizing:border-box" arriba). */
@media (max-width:480px){
  .leaderboard-podium{ grid-template-columns:1fr 1.15fr 1fr; gap:6px; padding:6px 6px 20px; }
  .leaderboard-crown-wrap{ height:36px; }
  .leaderboard-first-badge{ font-size:11px; padding:2px 8px 1.5px; top:-11px; }
  .leaderboard-avatar{ width:52px; height:52px; font-size:17px; }
  .leaderboard-place:first-child .leaderboard-avatar{ width:70px; height:70px; font-size:23px; }
  .leaderboard-place-name{ max-width:100%; font-size:10.5px; margin-top:6px; }
  .leaderboard-place-score{ font-size:15px; }
  .leaderboard-place:first-child .leaderboard-place-score{ font-size:20px; }
  .leaderboard-medal{ font-size:10px; margin-bottom:4px; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; scroll-behavior:auto !important; }
}
/* Corrector de desbordamiento para móviles */
body, html {
    overflow-x: hidden; /* Esto evita el movimiento lateral molesto */
    width: 100%;
}
/* Esto evita el zoom automático de Safari en iPhones */
input, textarea, select {
    font-size: 16px !important;
}

/* Asegura que cualquier imagen se adapte al ancho de la pantalla */
img {
    max-width: 100%;
    height: auto;
}
